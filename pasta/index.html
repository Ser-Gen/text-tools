<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pasta</title>
	<style>
		html,
		body {
			height: 100%;
			overflow: hidden;
		}
		body {
			margin: 0;
		}
		#workspace {
			display: flex;
			height: calc(100% - 22px);
		}
		#container,
		#previewPane {
			flex: 1 1 0;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
		}
		#previewPane {
			border-left: 1px solid #3c3c3c;
			background-color: #1e1e1e;
		}
		#previewPane iframe {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
		}
		/* на узком экране половина ширины — это пара слов в строке */
		@media (max-width: 700px) {
			#workspace {
				flex-direction: column;
			}
			#previewPane {
				border-left: 0;
				border-top: 1px solid #3c3c3c;
			}
		}
		#panel {
			background-color: rgb(0, 122, 204);
			color: #fff;
			height: 22px;
			padding-left: 10px;
			padding-right: 10px;
		}
		#panel a {
			color: #fff;
			text-decoration: none;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			margin-right: 1em;
		}
		#panel #right {
			float: right;
		}
		#panel .dimmed {
			opacity: .6;
		}
	</style>
	<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
	<div id="workspace">
		<div id="container"></div>
		<div id="previewPane" hidden></div>
	</div>
	<div id="panel">
		<a href="../">&larr; В список</a>
		<div id="right">
			<button id="previewToggle" hidden>превью</button>
			<button id="spellcheckToggle">орфо</button>
			<select id="modesPicker">
				<option value="plaintext" selected>plaintext</option>
			</select>
		</div>
	</div>

<script src="../lib/browserDetector.js"></script>
<script src="../lib/textFileInput.js"></script>
<script src="../lib/fflate.js"></script>
<script src="../lib/saveload.js"></script>
<script src="../lib/pageTitle.js"></script>
<script src="../lib/spellcheck/spellcheck.js"></script>
<script src="../lib/preview/preview.js"></script>
<script src="../lib/beautify/dist/main.js"></script>
<script src="../editor/min/vs/loader.js"></script>
<script>
require.config({
	paths: {
		'vs': '../editor/min/vs',
	},
});
require([
	'vs/editor/editor.main'
], onEditor);

function onEditor () {
	setModesOptions();
	
	var editor = monaco.editor.create(
		document.getElementById("container"), {
			language: "plaintext",
			theme: "vs-dark",
			wordWrap: 'on',
			automaticLayout: true,
			renderWhitespace: true,
			insertSpaces: false,
			tabSize: 4,

			value: "Привет!",
		}
	);

	// орфография: plaintext и markdown, вся работа в воркере. Включена ли —
	// личная настройка, поэтому в localStorage, а не в адресной строке
	var SPELLCHECK_KEY = 'pastaSpellcheck';
	var spellcheck = attachSpellcheck(editor, {
		workerUrl: '../lib/spellcheck/worker.js',
		enabled: recallFlag(SPELLCHECK_KEY, true),
		onStatus: renderSpellcheckStatus,
	});

	spellcheckToggle.onclick = function () {
		var value = !spellcheck.isEnabled();

		rememberFlag(SPELLCHECK_KEY, value);
		spellcheck.setEnabled(value);
	};

	// превью markdown рядом с редактором. Тоже личная настройка: ссылкой
	// делятся текстом, а не тем, как его смотреть
	var PREVIEW_KEY = 'pastaPreview';
	var preview = attachMarkdownPreview(editor, {
		container: previewPane,
		// грузится, только когда превью включат
		markedUrl: '../lib/preview/vendor/marked.umd.js',
		enabled: recallFlag(PREVIEW_KEY, false),
		onStatus: renderPreviewStatus,
	});

	previewToggle.onclick = function () {
		var value = !preview.isEnabled();

		rememberFlag(PREVIEW_KEY, value);
		preview.setEnabled(value);
	};

	const onUpdateDebounced = debounce(onUpdate);

	load()
		.then(data => {
			if (data?.texts?.length === 1) {
				editor.getModel().setValue(data.texts[0]);
			}

			if (data?.mode) {
				monaco.editor.setModelLanguage(editor.getModel(), data.mode);
				modesPicker.value = data.mode;
			}
		}, onLoadFail)
		.catch(onLoadFail)

	editor.onDidChangeModelContent(onUpdateDebounced);

	updatePageTitle(editor.getModel().getValue(), 'Pasta');

	// чтобы можно было писать сразу после загрузки
	editor.focus();

	// Press F1 => the action will appear
	editor.addAction({
		id: 'format-html-css-js',
		label: 'Format HTML CSS JS',
		run: function (ed) {
			const editorValue = editor.getModel().getValue();
			const beautifyOptions ={
				'indent-with-tabs': true,
				'wrap-attributes': 'force-aligned',
			};

			switch (modesPicker.value) {
				case 'html':
					beautifyHTML(editorValue.trim()).then(r=>{
						editor.getModel().setValue(r);
					})
					break;
				case 'javascript':
					editor.getModel().setValue(beautifyJS(editorValue.trim(), beautifyOptions));
					break;
				case 'css':
					editor.getModel().setValue(beautifyCSS(editorValue.trim(), beautifyOptions));
					break;
			}
		}
	});

	modesPicker.onchange = function (e) {
		monaco.editor.setModelLanguage(editor.getModel(), this.value);
		onUpdateDebounced();
	}

	var fileInputWrapper = document.createElement('div');

	fileInputWrapper.hidden = true;
	document.body.appendChild(fileInputWrapper);

	var textFileInput = new TextFileInput(fileInputWrapper, {
		onFiles: function (files) {
			onFiles(files, editor);
		}
	});

	// личные выключатели: в localStorage, не в адресной строке
	function recallFlag (key, fallback) {
		try {
			var value = localStorage.getItem(key);

			return value === null ? fallback : value === '1';
		}
		catch (e) {
			return fallback;
		}
	}

	function rememberFlag (key, value) {
		try {
			localStorage.setItem(key, value ? '1' : '0');
		}
		catch (e) {
			// приватный режим — настройка просто не переживёт перезагрузку
		}
	}

	// вызывается уже из attachSpellcheck, поэтому всё нужное — внутри функции
	function renderSpellcheckStatus (status) {
		var text = {
			off: 'орфо: выкл',
			notProse: 'орфо',
			loading: 'орфо: …',
			error: 'орфо: —',
			count: 'орфо: '+ status.count,
		};
		var title = {
			off: 'Проверка орфографии выключена',
			notProse: 'Орфография проверяется в plaintext и markdown',
			loading: 'Загружаются словари',
			error: 'Проверка орфографии не работает: '+ status.message,
			count: 'Слов не из словаря: '+ status.count +'. F8 — к следующему',
		};

		spellcheckToggle.textContent = text[status.state];
		spellcheckToggle.title = title[status.state];
		spellcheckToggle.className = status.state === 'off' || status.state === 'notProse' ? 'dimmed' : '';
	}

	// кнопка видна только в markdown: в других режимах показывать нечего
	function renderPreviewStatus (status) {
		var title = {
			off: 'Показать превью markdown рядом с текстом',
			on: 'Спрятать превью',
			error: 'Превью не работает: '+ status.message,
		};

		previewToggle.hidden = status.state === 'notMarkdown';
		previewToggle.textContent = status.state === 'error' ? 'превью: —' : 'превью';
		previewToggle.title = title[status.state] || '';
		previewToggle.className = status.state === 'on' ? '' : 'dimmed';
	}

	function onFiles (files, target) {
		var a = files[0];
		var reader = new FileReader();

		reader.onload = function() {
			var language = findLanguageByFile(a);

			if (language) {
				monaco.editor.setModelLanguage(target.getModel(), language.id);
				modesPicker.value = language.id;
			}

			target.getModel().setValue(reader.result);
		};
		reader.readAsText(a);
	}

	function findLanguageByFile (file) {
		var result = '';
		var languages = monaco.languages.getLanguages();
		var extension = '.'+ file.name.split('.').pop();

		for (var i = 0; i < languages.length; i++) {
			if (
				languages[i].extensions?.indexOf(extension) > -1
			) {
				return languages[i];
			}
		}

		return result;
	}

	function onUpdate () {
		const editorValue = editor.getModel().getValue();

		updatePageTitle(editorValue, 'Pasta');

		save({
			type: 'pasta',
			texts: [
				editorValue,
			],
			mode: modesPicker.value,
		});
	}

	function onLoadFail (e) {
		location.hash = '';
	}

	function setModesOptions () {
		var MODES = (function() {
			var modesIds = monaco.languages.getLanguages().map(function(lang) {
				return lang.id;
			});

			modesIds.sort();

			return modesIds.map(function(modeId) {
				return {
					modeId: modeId,
				};
			});
		})();

		for (var i = 0; i < MODES.length; i++) {
			var o = document.createElement('option');

			o.textContent = MODES[i].modeId;
			modesPicker.appendChild(o);
		}
	}
}
</script>
</body>
</html>
