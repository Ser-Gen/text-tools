<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tree-shaking</title>
	<style>
	body {
		background-color: #333;
		color: #fff;
	}
	</style>
</head>
<body>
	<textarea name="" id="k" cols="30" rows="10"></textarea>
	<button id="s">s</button>

	<script src="dist/main.js"></script>
	<!-- <script src="dist/beautify-css.min.js"></script> -->
	<script>
		s.onclick = function () {
			beautifyHTML(`${k.value}`).then(r=>{
				document.body.innerHTML +='<pre>'+r.replace(/>/g, '&gt;').replace(/</g, '&lt;')
			});

			// document.body.innerHTML +='<pre>'+beautifyJS(k.value.trim(), {
			// 	'indent-with-tabs': true,
			// })+'</pre>';

			// document.body.innerHTML +='<pre>'+beautifyCSS(k.value.trim(), {
			// 	'indent-with-tabs': true,
			// })+'</pre>';
		}
	</script>
</body>
</html>
